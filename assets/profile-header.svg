<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Muratov</title>
  <desc id="desc">Computer Science at the University of Toronto Mississauga, focused on security, privacy, systems, and the Gapwise ecosystem. The Gapwise deer mark appears in blue, white, and purple for the core app, developer documentation, and AI service.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.58" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#11101D"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(792 94) rotate(145) scale(330 240)">
      <stop stop-color="#4EA7FE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4EA7FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 250) rotate(-132) scale(330 240)">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="84" y1="62" x2="274" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EA7FE"/>
      <stop offset="0.54" stop-color="#F0F6FC"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8B949E" stroke-opacity="0.045"/>
    </pattern>

    <symbol id="gapwiseDeer" viewBox="350 315 554 554">
      <path d="M627 638 540 534c-21-19-47-32-75-49-47-29-68-77-68-132h31c2 32 13 63 34 87 6 6 12 12 20 18-3-14-3-27-1-39 2-13 6-24 12-33l25 13c-7 15-10 30-8 42 1 17 7 29 15 37 7 8 13 12 19 15l83 37Z"/>
      <path d="M627 638 540 534c-21-19-47-32-75-49-47-29-68-77-68-132h31c2 32 13 63 34 87 6 6 12 12 20 18-3-14-3-27-1-39 2-13 6-24 12-33l25 13c-7 15-10 30-8 42 1 17 7 29 15 37 7 8 13 12 19 15l83 37Z" transform="translate(1254 0) scale(-1 1)"/>
      <path d="M627 692 522 558c-18-19-40-33-59-39-15-1-31-1-48-1 0 30 11 56 36 76 17 12 35 16 74 16v120c0 8 3 14 8 20l72 100c5 7 12 10 22 10Z"/>
      <path d="M627 692 522 558c-18-19-40-33-59-39-15-1-31-1-48-1 0 30 11 56 36 76 17 12 35 16 74 16v120c0 8 3 14 8 20l72 100c5 7 12 10 22 10Z" transform="translate(1254 0) scale(-1 1)"/>
    </symbol>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#blueGlow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#purpleGlow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="#30363D"/>

  <rect x="84" y="61" width="190" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="84" y="126" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="-1.4">Andrew Muratov</text>
  <text x="86" y="168" fill="#B1BAC4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Computer Science · University of Toronto Mississauga</text>
  <text x="86" y="208" fill="#8C959F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Security · Privacy · Systems · Software Architecture</text>
  <text x="86" y="250" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Building Gapwise and the infrastructure around it.</text>

  <text x="735" y="63" fill="#8C959F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">GAPWISE ECOSYSTEM</text>

  <g transform="translate(725 82)">

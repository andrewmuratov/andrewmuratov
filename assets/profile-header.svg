<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Muratov</title>
  <desc id="desc">Computer Science at the University of Toronto Mississauga. Security, privacy, systems, and software architecture. Building the Gapwise ecosystem across web and platform, native mobile, permissioned AI, and developer documentation.</desc>


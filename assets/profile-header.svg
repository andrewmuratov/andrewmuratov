    <circle cx="66" cy="66" r="42" fill="#4EA7FE" fill-opacity="0.075" stroke="#4EA7FE" stroke-opacity="0.18"/>
    <use href="#gapwiseDeer" x="31" y="31" width="70" height="70" fill="#4EA7FE"/>
    <text x="66" y="132" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Gapwise</text>
    <text x="66" y="151" text-anchor="middle" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">core + platform</text>
  </g>

  <g transform="translate(875 82)">
    <rect width="132" height="166" rx="18" fill="#161B22" stroke="#F0F6FC" stroke-opacity="0.20"/>
    <circle cx="66" cy="66" r="42" fill="#F0F6FC" fill-opacity="0.045" stroke="#F0F6FC" stroke-opacity="0.12"/>
    <use href="#gapwiseDeer" x="31" y="31" width="70" height="70" fill="#FFFFFF"/>
    <text x="66" y="132" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Docs</text>
    <text x="66" y="151" text-anchor="middle" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">developer docs</text>
  </g>

  <g transform="translate(1025 82)">
    <rect width="132" height="166" rx="18" fill="#171321" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <circle cx="66" cy="66" r="42" fill="#8B5CF6" fill-opacity="0.075" stroke="#8B5CF6" stroke-opacity="0.18"/>
    <use href="#gapwiseDeer" x="31" y="31" width="70" height="70" fill="#8B5CF6"/>
    <text x="66" y="132" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Gapwise AI</text>
    <text x="66" y="151" text-anchor="middle" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">MCP layer</text>
  </g>
</svg>
